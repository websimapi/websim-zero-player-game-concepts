<html><head><base href="." /><title>Detailed Terrain Generation</title><style>
body {
    margin: 0;
    overflow: hidden;
    background: #1a1a1a;
}

#terrainCanvas {
    border: 1px solid #333;
    background: #000;
}

.controls {
    position: fixed;
    top: 20px;
    right: 20px;
    background: rgba(0,0,0,0.8);
    padding: 15px;
    border-radius: 8px;
}
</style></head><body>
<div class="container">
    <canvas id="terrainCanvas"></canvas>
    <div class="controls">
        <button onclick="regenerateTerrain()">Regenerate Terrain</button>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
let scene, camera, renderer, terrain, water;
const WIDTH = window.innerWidth;
const HEIGHT = window.innerHeight;

function init() {
    scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x87ceeb, 0.002);
    
    camera = new THREE.PerspectiveCamera(75, WIDTH / HEIGHT, 0.1, 1000);
    renderer = new THREE.WebGLRenderer({ 
        canvas: document.getElementById('terrainCanvas'),
        antialias: true
    });
    renderer.setSize(WIDTH, HEIGHT);
    renderer.shadowMap.enabled = true;

    camera.position.set(0, 100, 150);
    camera.lookAt(0, 0, 0);

    const lights = setupLights();
    createTerrain();
    createWater();
    animate();
}

function setupLights() {
    // Clear existing lights
    scene.children = scene.children.filter(child => !(child instanceof THREE.Light));
    
    const ambientLight = new THREE.AmbientLight(0x404040, 0.6);
    scene.add(ambientLight);

    const directionalLight = new THREE.DirectionalLight(0xffffff, 1.2);
    directionalLight.position.set(100, 100, 50);
    directionalLight.castShadow = true;
    directionalLight.shadow.mapSize.width = 2048;
    directionalLight.shadow.mapSize.height = 2048;
    scene.add(directionalLight);

    const hemisphereLight = new THREE.HemisphereLight(0xffffbb, 0x080820, 0.8);
    scene.add(hemisphereLight);

    return [ambientLight, directionalLight, hemisphereLight];
}

function createTerrain() {
    const geometry = new THREE.PlaneGeometry(200, 200, 256, 256);
    const material = new THREE.MeshPhongMaterial({
        vertexColors: true,
        flatShading: true,
        shininess: 0
    });

    const positions = geometry.attributes.position.array;
    const colors = new Float32Array(positions.length);
    
    for (let i = 0; i < positions.length; i += 3) {
        const x = positions[i] * 0.1;
        const z = positions[i + 2] * 0.1;
        
        let height = 0;
        height += Math.sin(x * 0.3) * Math.cos(z * 0.3) * 30; // Base mountains
        height += improvedNoise(x * 0.2, z * 0.2) * 50; // Large features
        height += improvedNoise(x * 0.8, z * 0.8) * 25; // Medium features
        height += improvedNoise(x * 2, z * 2) * 10; // Small features
        
        positions[i + 1] = height;

        const color = new THREE.Color();
        if (height < 0) {
            color.setRGB(0.2, 0.3, 0.7); // Deep water
        } else if (height < 5) {
            color.setRGB(0.8, 0.7, 0.4); // Beach
        } else if (height < 15) {
            color.setRGB(0.2, 0.6, 0.2); // Grass
        } else if (height < 25) {
            color.setRGB(0.4, 0.4, 0.4); // Rock
        } else {
            color.setRGB(1, 1, 1); // Snow
        }

        colors[i] = color.r;
        colors[i + 1] = color.g;
        colors[i + 2] = color.b;
    }

    geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
    geometry.computeVertexNormals();
    
    terrain = new THREE.Mesh(geometry, material);
    terrain.rotation.x = -Math.PI / 2;
    terrain.receiveShadow = true;
    terrain.castShadow = true;
    scene.add(terrain);
}

function createWater() {
    const waterGeometry = new THREE.PlaneGeometry(200, 200, 1, 1);
    const waterMaterial = new THREE.MeshPhongMaterial({
        color: 0x0077be,
        transparent: true,
        opacity: 0.6,
        shininess: 90
    });
    
    water = new THREE.Mesh(waterGeometry, waterMaterial);
    water.rotation.x = -Math.PI / 2;
    water.position.y = -2;
    scene.add(water);
}

function improvedNoise(x, z) {
    return (Math.sin(x) * Math.cos(z) + 
            Math.sin(x * 2.5) * Math.cos(z * 2.5) * 0.5 +
            Math.sin(x * 5) * Math.cos(z * 5) * 0.25) / 1.75;
}

function regenerateTerrain() {
    scene.remove(terrain);
    scene.remove(water);
    setupLights();
    createTerrain();
    createWater();
}

function animate() {
    requestAnimationFrame(animate);
    renderer.render(scene, camera);
}

window.addEventListener('resize', () => {
    const WIDTH = window.innerWidth;
    const HEIGHT = window.innerHeight;
    renderer.setSize(WIDTH, HEIGHT);
    camera.aspect = WIDTH / HEIGHT;
    camera.updateProjectionMatrix();
});

window.addEventListener('DOMContentLoaded', init);
</script><script defer src="https://static.cloudflareinsights.com/beacon.min.js/v8c78df7c7c0f484497ecbca7046644da1771523124516" integrity="sha512-8DS7rgIrAmghBFwoOTujcf6D9rXvH8xm8JQ1Ja01h9QX8EzXldiszufYa4IFfKdLUKTTrnSFXLDkUEOTrZQ8Qg==" data-cf-beacon='{"version":"2024.11.0","token":"4c6229722a6346bc8eb5cb0e5eae5d41","server_timing":{"name":{"cfCacheStatus":true,"cfEdge":true,"cfExtPri":true,"cfL4":true,"cfOrigin":true,"cfSpeedBrain":true},"location_startswith":null}}' crossorigin="anonymous"></script>
</body></html>
